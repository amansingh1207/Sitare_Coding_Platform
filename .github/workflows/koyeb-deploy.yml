name: Deploy to Koyeb (Free Forever, No Credit Card)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-koyeb:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend
        working-directory: ./backend
        run: mvn clean package -DskipTests -q

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build -q

      - name: Build & Push Docker Image (Backend)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb
        uses: koyeb/action-deploy@v1
        with:
          token: ${{ secrets.KOYEB_TOKEN }}
          app: codingjudge
          service: backend
          git_branch: main
          env_vars: |
            DB_HOST=${{ secrets.SUPABASE_DB_HOST }}
            DB_PORT=6543
            DB_NAME=postgres
            DB_USER=postgres.jqmhbycvcgbraerdystn
            DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPRING_PROFILES_ACTIVE=prod

  deploy-frontend:
    name: Deploy Frontend to Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-koyeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build -q

      - name: Build & Push Docker Image (Frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb
        uses: koyeb/action-deploy@v1
        with:
          token: ${{ secrets.KOYEB_TOKEN }}
          app: codingjudge
          service: frontend
          git_branch: main
          env_vars: |
            VITE_API_BASE_URL=https://${{ secrets.KOYEB_APP_NAME }}.koyeb.app/api