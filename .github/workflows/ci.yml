name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Maven configuration
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  backend:
    name: Backend (Java 17, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: ./backend
        run: mvn -B -ntp clean test

      - name: Build backend JAR
        working-directory: ./backend
        run: mvn -B -ntp package -DskipTests

  frontend:
    name: Frontend (Node 20, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  judge:
    name: Judge (Docker sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build judge sandbox Docker image
        working-directory: ./docker/sandbox
        run: docker build -t codingjudge/sandbox:test .

      - name: Test sandbox image runs
        run: |
          docker run --rm codingjudge/sandbox:test

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: codingjudge/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: codingjudge/frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build judge sandbox Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/sandbox
          file: ./docker/sandbox/Dockerfile
          load: true
          tags: codingjudge/sandbox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max