# Application
spring.application.name=codingjudge
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codingjudge}
spring.datasource.username=${DB_USER:codingjudge}
spring.datasource.password=${DB_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_string_at_least_256_bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Judge
judge.docker-image=${JUDGE_DOCKER_IMAGE:codingjudge/sandbox:latest}
judge.docker-host=${JUDGE_DOCKER_HOST:}
judge.timeout-ms=${JUDGE_TIMEOUT_MS:10000}
judge.memory-limit-mb=${JUDGE_MEMORY_LIMIT_MB:256}
judge.cpu-limit=${JUDGE_CPU_LIMIT:1.0}
judge.max-output-size-kb=${JUDGE_MAX_OUTPUT_SIZE_KB:64}
judge.max-source-size-kb=${JUDGE_MAX_SOURCE_SIZE_KB:256}

# Email (SendGrid API - works on Render free tier)
sendgrid.api.key=${SENDGRID_API_KEY:}
spring.mail.from=codingjudgesitare@gmail.com
spring.mail.from-name=CodingJudge

# Logging
logging.level.com.codingjudge=INFO
