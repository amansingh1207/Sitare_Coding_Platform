# Application: bind all interfaces and honor Render's PORT env (falls back
# to 8080 locally). Render scans for the open port; a hardcoded 8080 here
# is why deploys built fine but timed out with "no open ports detected".
spring.application.name=codingjudge
server.address=0.0.0.0
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codingjudge}
spring.datasource.username=${DB_USER:codingjudge}
spring.datasource.password=${DB_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_string_at_least_256_bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Judge
judge.docker-image=${JUDGE_DOCKER_IMAGE:codingjudge/sandbox:latest}
judge.docker-host=${JUDGE_DOCKER_HOST:}
# Execution backend: docker (local default) or judge0 (production without Docker).
execution.provider=${EXECUTION_PROVIDER:docker}
# Background judging queue (DB-backed; set false to judge synchronously).
judge.worker.enabled=${JUDGE_WORKER_ENABLED:true}
judge.worker.poll-ms=${JUDGE_WORKER_POLL_MS:1000}
judge.worker.threads.core=${JUDGE_WORKER_THREADS_CORE:2}
judge.worker.threads.max=${JUDGE_WORKER_THREADS_MAX:4}
judge.worker.queue-capacity=${JUDGE_WORKER_QUEUE_CAPACITY:100}
judge.worker.max-claim-per-tick=${JUDGE_WORKER_MAX_CLAIM:8}
# Judge0 (only used when execution.provider=judge0).
judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
judge0.api.key=${JUDGE0_API_KEY:}
judge0.api.host=${JUDGE0_API_HOST:}
judge0.poll-ms=${JUDGE0_POLL_MS:1000}
judge0.max-wait-ms=${JUDGE0_MAX_WAIT_MS:120000}
# Rlimit-based limits for cgroup-v1-less Judge0 hosts (local POC only).
judge0.per-process-limits=${JUDGE0_PER_PROCESS_LIMITS:false}
# DOMjudge provider (only used when execution.provider=domjudge).
domjudge.base-url=${DOMJUDGE_BASE_URL:}
domjudge.contest=${DOMJUDGE_CONTEST:}
domjudge.user=${DOMJUDGE_USER:}
domjudge.password=${DOMJUDGE_PASSWORD:}
domjudge.poll-ms=${DOMJUDGE_POLL_MS:2000}
domjudge.max-wait-ms=${DOMJUDGE_MAX_WAIT_MS:300000}
judge.timeout-ms=${JUDGE_TIMEOUT_MS:10000}
judge.memory-limit-mb=${JUDGE_MEMORY_LIMIT_MB:256}
judge.cpu-limit=${JUDGE_CPU_LIMIT:1.0}
judge.max-output-size-kb=${JUDGE_MAX_OUTPUT_SIZE_KB:64}
judge.max-source-size-kb=${JUDGE_MAX_SOURCE_SIZE_KB:256}

# Email (SendGrid API - works on Render free tier)
sendgrid.api.key=${SENDGRID_API_KEY:}
spring.mail.from=codingjudgesitare@gmail.com
spring.mail.from-name=CodingJudge

# Logging
logging.level.com.codingjudge=INFO
