# Test configuration - uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=test_secret_key_for_testing_only_not_for_production_use
jwt.expiration-ms=86400000

# Mail via Gmail SMTP - disabled in tests (no real network calls)
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500
MAIL_USERNAME=test@example.com
MAIL_FROM_NAME=CodingJudge Test

# Phase 2 queue: tests judge synchronously so every existing verdict
# assertion keeps passing unchanged; async behavior has dedicated tests.
judge.worker.enabled=false

# Submission cooldowns off by default in tests (many tests submit
# repeatedly); the 429 wiring test enables them via @TestPropertySource.
judge.cooldown.submit-seconds=0
judge.cooldown.run-seconds=0
judge.cooldown.custom-run-seconds=0
