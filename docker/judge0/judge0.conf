# Judge0 internal passwords — LOCAL DEVELOPMENT ONLY.
# These protect Judge0's own throwaway Redis/Postgres containers on your
# laptop. They are NOT application secrets and MUST NOT be reused anywhere
# else (never in production, never on Render/Neon).
REDIS_PASSWORD=5ff6b08772b9885e16ef980294c1207f
POSTGRES_PASSWORD=a5fea9588d2e06a14425cca0288020fa

# Hostnames must match the service names in docker-compose.judge0.yml
# (official docs use db/redis; ours are prefixed to avoid collisions).
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
REDIS_HOST=judge0-redis

# Local POC tweak: allow roomy per-process address-space limits (the stock
# 512000 KB cap is too small for a JVM, which reserves heap virtually).
# Hosted/production Judge0 keeps the default.
MAX_MEMORY_LIMIT=8000000
